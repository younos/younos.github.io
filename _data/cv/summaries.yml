# Summary for jobs in Data Science
data_science:
  title:
    en: Data Scientist
    fr: Data Scientist
    de: Data Scientist
  text:
    en: Data Scientist and Technical Lead with experience synthesizing research data into reports and business strategy. Specialized in using Databricks and Power BI to automate the path from raw data sources to stakeholder-ready insights.
    fr: Data Scientist et Responsable Technique, expert dans la synthèse de données de recherche pour l'élaboration de rapports et de stratégies d'entreprise. Spécialisé dans l'utilisation de Databricks et Power BI pour automatiser le flux des données brutes vers des indicateurs exploitables par l'entreprise.
    de: Data Scientist und Technical Lead mit Erfahrung in der Aufbereitung von Forschungsdaten für Berichte und Unternehmensstrategien. Spezialisiert auf die Nutzung von Databricks und Power BI, um den Prozess von der Rohdatenquelle bis hin zu entscheidungsrelevanten Insights für Stakeholder zu automatisieren.

# Summary for jobs in Data Engineering
data_engineering:
  title:
    en: Data Engineer
    fr: Data Engineer
    de: Data Engineer
  text:
    en: Data Engineer and Technical Lead focused on developing end-to-end Azure data pipelines (ADF, Databricks, SQL, Power BI). Experienced in integrating LIMS and other upstream sources into SQL warehouses while maintaining data governance and automated orchestration.
    fr: Data Engineer et Responsable Technique spécialisé dans le développement de pipelines de données Azure de bout en bout (ADF, Databricks, SQL, Power BI). Expérimenté dans l'intégration de sources LIMS et autres flux amont vers des entrepôts SQL, tout en garantissant la gouvernance des données et l'orchestration automatisée.
    de: Data Engineer und Technical Lead mit Fokus auf die Entwicklung von End-to-End Azure-Datenpipelines (ADF, Databricks, SQL, Power BI). Erfahren in der Integration von LIMS und anderen Upstream-Quellen in SQL-Warehouses unter Einhaltung von Data-Governance-Standards und automatisierter Orchestrierung.

# Summary for jobs in Software Engineering
software_engineering:
  title:
    en: Software Engineer
    fr: Ingénieur Logiciel
    de: Software-Entwickler
  text:
    en: Software Engineer and Technical Lead with a background in React, Python, and JavaFX. Specialized in building cloud-native applications and automated workflows within the Azure ecosystem to support data-intensive research projects.
    fr: Ingénieur Logiciel et Responsable Technique avec une expérience en React, Python et JavaFX. Spécialisé dans la conception d'applications "cloud-native" et de flux de travail automatisés au sein de l'écosystème Azure pour soutenir des projets de recherche intensifs en données.
    de: Software Engineer und Technical Lead mit fundierten Kenntnissen in React, Python und JavaFX. Spezialisiert auf die Entwicklung von Cloud-native Applikationen und automatisierten Workflows im Azure-Ökosystem zur Unterstützung datenintensiver Forschungsprojekte.
