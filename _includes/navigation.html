<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="{{ '/' | relative_url }}">
    <img src={{ '/assets/images/favicon.png' | relative_url }} width="30" height="30" class="d-inline-block align-top" alt="logo">
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNavDropdown">
    <ul class="navbar-nav">
      {% for item in site.data.navigation %}
        {% if item.name == "CV" %}
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" id="navbarDropdownMenuLink" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              {{ item.name }}
            </a>
            <ul class="dropdown-menu bg-light" aria-labelledby="navbarDropdownMenuLink">
              {% for cv in site.cv %}
                <li>
                  <a class="dropdown-item" href="{{ cv.url | relative_url }}">{{ cv.title}}</a>
                </li>
              {% endfor %}
            </ul>
          </li>
        {% else %}
          <li class="nav-item{% if page.url == item.link %}'current'{% endif %}">
            <a class="nav-link" href="{{ item.link }}">{{ item.name }}</a>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
    <div class="collapse navbar-collapse justify-content-end visually-hidden-focusable">
      <ul class="navbar-nav">
        <li><a href="#" class="btn btn-primary switch">Dark Mode</a></li>
      </ul>
    </div>
  </div>
</nav>
